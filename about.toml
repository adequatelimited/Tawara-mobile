# THE COPYRIGHT HOLDERS. The MIT, ISC and BSD licences require the copyright
# notice to accompany the software, so each crate under one of them gets the
# text naming its holder wherever the crate publishes one. cargo-about reads
# licence files only under names it recognises; otherwise it prints the
# standard text, whose copyright line is a template naming nobody. The
# entries below supply the crate's own text:
#
# - `files`: a file in the package under a name cargo-about does not read,
#   or a different file from the one it would pick;
# - `git`: a file in the crate's repository at the published commit (from the
#   package's `.cargo_vcs_info.json`), fetched from raw.githubusercontent.com
#   on every run. A failed fetch only warns, and the byte comparison in
#   `ci/notices.sh --check` then fails.
#
# Every file is pinned by SHA-256. A name covers every version of the crate in
# the graph; a clarification that fails for one version leaves that version
# to its package's files, with a warning.
#
# Some crates publish their licence without a copyright line anywhere; their
# text is printed as published. Eight versions of Objective-C binding crates
# publish no licence text at all; they get the standard text with the
# template line removed by ci/notices.sh, and the policy test lists them.

# libm keeps its MIT text and its sources' copyright lines in one LICENSE.txt,
# which cargo-about does not match to a licence.

[libm]

[libm.clarify]
license = "MIT"

[[libm.clarify.files]]
path = "LICENSE.txt"
license = "MIT"
checksum = "3823dda7cf046602f4b4e77ec8e227863dc4736037cc85bb33d9f19febe16bb7"

# cfg_aliases ships NOTICES.md, which cargo-about reads as a second MIT text.
# The crate's licence is its LICENSE.

[cfg_aliases]

[cfg_aliases.clarify]
license = "MIT"

[[cfg_aliases.clarify.files]]
path = "LICENSE"
license = "MIT"
checksum = "31b94860253d8ec7b4529f51901044d3b459d6292d996504a36b1bae3a36a812"

