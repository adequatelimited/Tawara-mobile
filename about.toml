# cargo-about's configuration for THIRD-PARTY-NOTICES.txt, read by
# ci/notices.sh from the repository root.
#
# Each checksum pins the bytes of a licence file. When the file changes,
# cargo-about logs a mismatch, falls back to whatever text it finds, and
# still exits 0 under --fail; the byte comparison in `ci/notices.sh --check`
# catches the change.

# The licences the notices may name: deny.toml's allow list, the same ten
# identifiers in the same order. Per-crate exceptions below: OFL-1.1 for
# tawara-app's fonts, and the Mochimo licence for the library and Tawara's
# crates. crates/mobile/tests/policy.rs holds this list equal to deny.toml's
# and the exceptions to its own table. With --fail, a crate under any other
# licence stops the run rather than dropping out of the notices.
accepted = [
    "MIT",
    "Apache-2.0",
    "ISC",
    "BSD-3-Clause",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "BSD-2-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "Zlib",
]

# The shipped targets: the two Android ABIs in the APK (TARGETS in
# platform/android/tawara.sh) and the iOS device build (`device` in
# platform/ios/tawara.sh). The policy test holds this list to both scripts.
# cargo-about takes the union of the targets. The simulator target is not
# shipped; including it does not change the output.
#
# FEATURES. ci/notices.sh runs without --all-features, so the graph is the
# default-features graph, which is what the shipped builds use: neither
# platform script passes features, and the workspace's crates declare none.
# A script that starts passing features must pass them here too.
targets = ["aarch64-linux-android", "x86_64-linux-android", "aarch64-apple-ios"]

# Dev-dependencies are in no shipped binary, so they are left out. Build
# dependencies and transitive dependencies are kept.
ignore-dev-dependencies = true
ignore-build-dependencies = false
ignore-transitive-dependencies = false

# cargo-about's built-in handling of chrono 0.4.x, which keeps the MIT and
# Apache-2.0 texts in one file; without it chrono's MIT text falls back to the
# canonical text with no copyright line. It matches the file by checksum, so
# a changed file changes the notices and fails the byte comparison.
workarounds = ["chrono"]

